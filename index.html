<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Отчёты художников Catwar</title>
<style>
:root{--bg:#f3efe9;--card:#fffdfa;--tx:#2a2420;--mu:#8a8076;--ac:#c4562a;--ac2:#fbe9df;--bd:#e6dfd5;--ok:#2d8a57;--okbg:#e0f3e8;--sh:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#1a1715;--card:#252120;--tx:#efe9e2;--mu:#a1978c;--ac:#ec8a55;--ac2:#3b2a21;--bd:#3a3531;--ok:#5fc48c;--okbg:#1c3325;--sh:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#c4562a,#e08a4f);color:#fff;padding:26px 16px 70px}
.w{max-width:900px;margin:0 auto}
header .w{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{font-size:26px;margin:0}
header p{margin:4px 0 0;opacity:.9}
main{max-width:900px;margin:-48px auto 0;padding:0 16px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:16px}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--mu);margin:0 0 4px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;outline:none}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--ac)}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.g{background:none;border-style:dashed;color:var(--mu)}
header button{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 150px}
.art{border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:12px;padding:14px;margin:12px 0;background:var(--bg)}
.arthead{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
.arthead>div{flex:0 1 200px}
.arthead .sp{flex:1}
.wk{display:grid;grid-template-columns:130px 1fr 1fr 34px;gap:8px;margin-bottom:8px;align-items:start}
.wk .x{padding:8px 0;color:var(--mu)}
.wlab{display:none}
@media(max-width:640px){.wk{grid-template-columns:1fr 34px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px}.wk .t{grid-column:1}.wk .a,.wk .b{grid-column:1 / 3}.wk .x{grid-row:1;grid-column:2}}
.hint{font-size:12px;color:var(--mu)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:26px 0 12px}
.bar h2{font-size:18px;margin:0 auto 0 0}
.tab{border-radius:99px;padding:5px 14px;font-size:14px}
.tab.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.item{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.item .m{flex:1 1 260px;min-width:0}
.date{font-weight:700;font-size:16px}
.tags{color:var(--mu);font-size:13px;word-break:break-word}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--ac2);color:var(--ac);margin-left:6px;vertical-align:1px}
.badge.ok{background:var(--okbg);color:var(--ok)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{padding:6px 11px;font-size:13px}
.empty{text-align:center;color:var(--mu);padding:34px 0}
#modal,#login{position:fixed;inset:0;background:rgba(20,10,5,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;z-index:5}
#modal.on,#login.on{display:flex}
.box{background:var(--card);border-radius:16px;max-width:720px;width:100%;padding:20px;margin:auto}
.pv{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.pv .t{font-size:18px;font-weight:700;margin-bottom:12px}
.pv .sub{font-weight:700;margin:12px 0 6px}
.pv table{border-collapse:collapse;margin-bottom:8px}
.pv td{border:1px solid var(--bd);padding:10px;text-align:center;vertical-align:middle}
.pv .ph{width:140px;height:90px;border:1px dashed var(--mu);border-radius:8px;display:flex;align-items:center;justify-content:center;margin:8px auto;color:var(--mu);font-size:13px}
.pv img{max-width:220px;max-height:220px;display:block;margin:8px auto}
.pv a{color:var(--ac);word-break:break-all;font-size:13px}
.banner{background:var(--ac2);color:var(--ac);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:160px}
</style>
</head>
<body>
<header><div class="w">
  <div><h1>🐱 Отчёты художников</h1><p>Работы сайтовой команды Catwar: создавайте отчёты, следите за отправкой Маляру</p></div>
  <button id="authBtn" style="display:none">Войти</button>
</div></header>

<main>
  <div class="banner" id="banner" style="display:none"></div>

  <section class="card" id="formCard">
    <h3 id="formTitle">Новый отчёт</h3>
    <div class="row">
      <div style="flex:0 1 180px"><label for="date">Дата</label><input type="date" id="date"></div>
      <div style="flex:3 1 260px"><label for="note">Заметка (не попадёт в отчёт)</label><input id="note" placeholder="Например: заказ на оформление сайта"></div>
    </div>
    <div id="arts"></div>
    <button class="g" id="addArt">+ Добавить художника</button>
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button id="cancel" style="display:none;flex:0 0 auto">Отменить правку</button>
      <button id="preview" style="flex:0 0 auto">Превью</button>
      <button class="p" id="save" style="flex:0 0 auto">Сохранить отчёт</button>
    </div>
  </section>

  <div class="bar">
    <h2>Отчёты</h2>
    <button class="tab on" data-f="all">Все</button>
    <button class="tab" data-f="no">Не отправлены</button>
    <button class="tab" data-f="yes">Отправлены</button>
  </div>
  <div id="list"></div>
</main>

<div id="modal"><div class="box">
  <div class="row" style="justify-content:space-between;align-items:center">
    <strong>Превью отчёта</strong><button id="closeM" style="flex:0 0 auto">Закрыть</button>
  </div>
  <div class="pv" id="pv"></div>
  <label for="bb">BB-код</label>
  <textarea id="bb" class="mono" readonly></textarea>
  <div class="row" style="margin-top:10px;justify-content:flex-end"><button class="p" id="copy" style="flex:0 0 auto">Скопировать BB-код</button></div>
</div></div>

<div id="login"><div class="box" style="max-width:380px">
  <h3 style="margin-top:0">Вход для редактирования</h3>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username">
  <label for="pw" style="margin-top:10px">Пароль</label><input id="pw" type="password" autocomplete="current-password">
  <div class="row" style="margin-top:14px;justify-content:flex-end">
    <button id="loginCancel" style="flex:0 0 auto">Отмена</button>
    <button class="p" id="loginGo" style="flex:0 0 auto">Войти</button>
  </div>
</div></div>
<div id="toast"></div>

<script>
/* ===== НАСТРОЙКА SUPABASE (оставьте пустым — тогда данные хранятся только в браузере) =====
   SQL для создания таблицы смотрите в сообщении Claude. */
var SUPABASE_URL = 'https://raafdurwxybhyisuacbp.supabase.co';
var SUPABASE_KEY = 'sb_publishable_30jxDVu05W_S9x48kOUakA_IGTFfYW0';   // anon / publishable ключ

(function(){
  var reports=[], sb=null, session=null, filter='all', editId=null, lastBB='';
  var LS='catwar-reports-v2', ORIGIN='https://catwar.su/';
  var $=function(s){return document.querySelector(s)};
  var TYPES={'иконка':'иконки','фон':'фоны','шапка':'шапки','баннер':'баннеры','значок':'значки','предмет':'предметы','аватар':'аватары','рамка':'рамки','кнопка':'кнопки'};

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2400)}
  function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function fmt(d){var p=(d||'').split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:d}
  function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'r'+Date.now()+Math.random().toString(16).slice(2)}
  function digits(s){return String(s||'').replace(/\D/g,'')}
  function canEdit(){return !sb||!!session}

  function plural(t){
    var k=t.toLowerCase().trim();if(TYPES[k])return TYPES[k];
    if(/[ая]$/.test(k))return k.slice(0,-1)+(/[гкхжшчщ]$/.test(k.slice(0,-1))||/я$/.test(k)?'и':'ы');
    if(/[ьй]$/.test(k))return k.slice(0,-1)+'и';
    return k+'ы';
  }
  function imgPath(u){
    u=String(u||'').trim();if(/^\d+$/.test(u))return 'cw3/things/'+u+'.png';
    var m=u.match(/(cw3\/things\/[^\s?#]+)/);return m?m[1]:u.replace(/^https?:\/\/catwar\.su\//,'');
  }
  function imgUrl(u){var p=imgPath(u);return /^https?:/.test(p)?p:ORIGIN+p.replace(/^\//,'')}
  function groups(a){
    var map={},order=[];
    a.works.forEach(function(w){var k=(w.type||'').toLowerCase().trim();if(!map[k]){map[k]={type:w.type||'',list:[]};order.push(k)}map[k].list.push(w)});
    return order.map(function(k){return map[k]});
  }

  function bbcode(r){
    var o='[size=13][b]Отчёт по заказу от сайтовой команды художников[/b] [/size]\n';
    r.artists.forEach(function(a){
      groups(a).forEach(function(g){
        if(g.list.length>1&&g.type)o+='[b]'+plural(g.type)+' х'+g.list.length+'[/b]\n';
        o+='[table=0]\n';
        g.list.forEach(function(w){
          o+='[tr]\n[td][center][b]Получили работу и установили на сайт:[/b]\n[br][img]'+imgPath(w.img)+'[/img]\n[url]'+imgUrl(w.img)+'[/url]'+
            (w.item?'\n[br][url='+w.item+']Ссылка на предмет[/url]':'')+'[/center][/td]\n[td]⠀[/td]\n[/tr]\n';
        });
        o+='[/table]\n';
      });
      o+='[b]Автор:[/b] [link'+a.id+'] ('+a.id+')\n';
    });
    return o.trim();
  }
  function previewHTML(r){
    var h='<div class="t">Отчёт по заказу от сайтовой команды художников</div>';
    r.artists.forEach(function(a){
      groups(a).forEach(function(g){
        if(g.list.length>1&&g.type)h+='<div class="sub">'+esc(plural(g.type))+' х'+g.list.length+'</div>';
        h+='<table>';
        g.list.forEach(function(w){
          var u=imgUrl(w.img);
          h+='<tr><td><b>Получили работу и установили на сайт:</b>'+
            '<img src="'+esc(u)+'" alt="" onerror="this.outerHTML=\'&lt;div class=ph&gt;нет превью&lt;/div&gt;\'">'+
            '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a>'+
            (w.item?'<br><a href="'+esc(w.item)+'" target="_blank" rel="noopener">Ссылка на предмет</a>':'')+'</td><td>⠀</td></tr>';
        });
        h+='</table>';
      });
      h+='<div style="margin-bottom:14px"><b>Автор:</b> <a href="'+ORIGIN+'cat'+esc(a.id)+'" target="_blank" rel="noopener">'+esc(a.id)+'</a> ('+esc(a.id)+')</div>';
    });
    return h;
  }

  /* ---------- хранилище ---------- */
  function localLoad(){try{reports=JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){reports=[]}}
  function localSave(){try{localStorage.setItem(LS,JSON.stringify(reports))}catch(e){toast('Не удалось сохранить в браузере')}}
  async function fetchAll(){
    if(!sb){localLoad();render();return}
    var q=await sb.from('reports').select('*').order('report_date',{ascending:false});
    if(q.error){toast('Ошибка загрузки: '+q.error.message);return}
    reports=q.data.map(function(x){return {id:x.id,date:x.report_date,note:x.note||'',sent:!!x.sent,artists:x.artists||[],created:x.created_at}});
    render();
  }
  async function persist(r,isNew){
    if(!sb){
      var i=reports.findIndex(function(x){return x.id===r.id});
      if(i<0)reports.push(r);else reports[i]=r;localSave();render();return true;
    }
    var row={report_date:r.date,note:r.note,sent:r.sent,artists:r.artists};
    var q=isNew?await sb.from('reports').insert(row):await sb.from('reports').update(row).eq('id',r.id);
    if(q.error){toast('Не сохранилось: '+q.error.message);return false}
    await fetchAll();return true;
  }
  async function remove(id){
    if(!sb){reports=reports.filter(function(x){return x.id!==id});localSave();render();return}
    var q=await sb.from('reports').delete().eq('id',id);
    if(q.error)toast('Не удалилось: '+q.error.message);else fetchAll();
  }
  function loadSB(){return new Promise(function(ok,no){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
  async function init(){
    if(SUPABASE_URL&&SUPABASE_KEY){
      try{
        await loadSB();
        sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
        var s=await sb.auth.getSession();session=s.data.session;
        sb.auth.onAuthStateChange(function(_e,ses){session=ses;ui()});
        $('#authBtn').style.display='';
      }catch(e){sb=null;toast('Supabase недоступен, работаю локально')}
    }
    ui();await fetchAll();
  }
  function ui(){
    var ed=canEdit();
    $('#formCard').style.display=ed?'':'none';
    $('#authBtn').textContent=session?'Выйти':'Войти';
    var b=$('#banner');
    if(!sb){b.style.display='';b.textContent='Supabase не подключён: отчёты хранятся только в этом браузере.'}
    else if(!session){b.style.display='';b.textContent='Режим просмотра. Чтобы создавать и менять отчёты, войдите.'}
    else b.style.display='none';
    render();
  }

  /* ---------- форма ---------- */
  function workRow(w,lastType){
    var d=document.createElement('div');d.className='wk';
    d.innerHTML='<div class="t"><input class="wt" list="types" placeholder="Вид: иконка"></div>'+
      '<div class="a"><input class="wi" placeholder="Ссылка на предмет"></div>'+
      '<div class="b"><input class="wm" placeholder="Ссылка на изображение или номер"></div>'+
      '<button class="x g" title="Убрать работу" style="padding:8px 0">✕</button>';
    d.querySelector('.wt').value=w?w.type:(lastType||'');
    d.querySelector('.wi').value=w?w.item:'';
    d.querySelector('.wm').value=w?w.img:'';
    d.querySelector('.x').onclick=function(){var box=d.parentNode;if(box.querySelectorAll('.wk').length>1)d.remove();else{d.querySelectorAll('input').forEach(function(i){i.value=''})}};
    return d;
  }
  function artBlock(a){
    var d=document.createElement('div');d.className='art';
    d.innerHTML='<div class="arthead"><div><label>ID художника</label><input class="aid" inputmode="numeric" placeholder="12345"></div><span class="sp"></span><button class="g rm" style="padding:6px 10px;font-size:13px">Убрать художника</button></div><div class="wks"></div>'+
      '<button class="g aw" style="padding:6px 12px;font-size:13px">+ Добавить работу</button>';
    d.querySelector('.aid').value=a?a.id:'';
    var box=d.querySelector('.wks');
    (a&&a.works.length?a.works:[null]).forEach(function(w){box.appendChild(workRow(w))});
    d.querySelector('.aw').onclick=function(){var last=box.querySelectorAll('.wt');box.appendChild(workRow(null,last.length?last[last.length-1].value:''));box.lastChild.querySelector('.wi').focus()};
    d.querySelector('.rm').onclick=function(){if(document.querySelectorAll('.art').length>1)d.remove();else resetForm(null)};
    return d;
  }
  function resetForm(r){
    editId=r?r.id:null;
    $('#date').value=r?r.date:today();$('#note').value=r?(r.note||''):'';
    var box=$('#arts');box.innerHTML='';
    (r?r.artists:[null]).forEach(function(a){box.appendChild(artBlock(a))});
    $('#cancel').style.display=r?'':'none';
    $('#formTitle').textContent=r?'Правка отчёта':'Новый отчёт';
    $('#save').textContent=r?'Сохранить изменения':'Сохранить отчёт';
  }
  function readForm(){
    var arts=[];
    document.querySelectorAll('.art').forEach(function(el){
      var id=digits(el.querySelector('.aid').value),ws=[];
      el.querySelectorAll('.wk').forEach(function(w){
        var t=w.querySelector('.wt').value.trim(),i=w.querySelector('.wi').value.trim(),m=w.querySelector('.wm').value.trim();
        if(t||i||m)ws.push({type:t,item:i,img:m});
      });
      if(id||ws.length)arts.push({id:id,works:ws});
    });
    return {date:$('#date').value||today(),note:$('#note').value.trim(),artists:arts};
  }
  function validate(r){
    if(!r.artists.length){toast('Добавьте хотя бы одного художника');return false}
    for(var i=0;i<r.artists.length;i++){
      var a=r.artists[i];
      if(!a.id){toast('Укажите ID у каждого художника');return false}
      if(!a.works.length){toast('У художника '+a.id+' нет работ');return false}
      for(var j=0;j<a.works.length;j++)if(!a.works[j].img){toast('У работы '+(j+1)+' художника '+a.id+' нет изображения');return false}
    }
    return true;
  }

  /* ---------- список ---------- */
  function render(){
    var list=reports.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||String(b.created||'').localeCompare(String(a.created||''))});
    if(filter==='no')list=list.filter(function(r){return !r.sent});
    if(filter==='yes')list=list.filter(function(r){return r.sent});
    var box=$('#list'),ed=canEdit();
    if(!list.length){box.innerHTML='<div class="empty">'+(reports.length?'В этой вкладке пока пусто':'Пока нет ни одного отчёта')+'</div>';return}
    box.innerHTML='';
    list.forEach(function(r){
      var n=r.artists.reduce(function(s,a){return s+a.works.length},0);
      var d=document.createElement('div');d.className='card item';
      d.innerHTML='<div class="m"><div class="date">'+fmt(r.date)+'<span class="badge'+(r.sent?' ok':'')+'">'+(r.sent?'Отправлен Маляру':'Не отправлен')+'</span></div>'+
        '<div class="tags">Художники: '+r.artists.map(function(a){return esc(a.id)+' ('+a.works.length+')'}).join(', ')+' · работ: '+n+'</div>'+
        (r.note?'<div class="tags">'+esc(r.note)+'</div>':'')+'</div>'+
        '<div class="acts">'+(ed?'<button data-a="sent">'+(r.sent?'Снять отметку':'Отправлен Маляру')+'</button>':'')+
        '<button data-a="pv">Превью</button>'+(ed?'<button data-a="ed">Править</button><button data-a="del">Удалить</button>':'')+'</div>';
      d.querySelector('.acts').onclick=function(e){
        var a=e.target.getAttribute&&e.target.getAttribute('data-a');if(!a)return;
        if(a==='sent'){var c=Object.assign({},r,{sent:!r.sent});persist(c,false)}
        if(a==='pv')openPv(r);
        if(a==='ed'){resetForm(r);window.scrollTo({top:0,behavior:'smooth'})}
        if(a==='del'){var b=e.target;if(b.dataset.sure){remove(r.id);toast('Отчёт удалён')}else{b.dataset.sure=1;b.textContent='Точно удалить?';setTimeout(function(){delete b.dataset.sure;b.textContent='Удалить'},3000)}}
      };
      box.appendChild(d);
    });
  }
  function openPv(r){lastBB=bbcode(r);$('#pv').innerHTML=previewHTML(r);$('#bb').value=lastBB;$('#modal').classList.add('on')}
  function copyBB(){
    var ok=function(){toast('BB-код скопирован')};
    function fb(){var t=$('#bb');t.select();try{document.execCommand('copy');ok()}catch(e){toast('Скопируйте вручную')}}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(lastBB).then(ok,fb);else fb();
  }

  /* ---------- события ---------- */
  $('#addArt').onclick=function(){$('#arts').appendChild(artBlock(null))};
  $('#cancel').onclick=function(){resetForm(null)};
  $('#preview').onclick=function(){var r=readForm();if(validate(r))openPv(r)};
  $('#save').onclick=async function(){
    var r=readForm();if(!validate(r))return;
    var old=editId&&reports.find(function(x){return x.id===editId});
    r.id=editId||uid();r.sent=old?!!old.sent:false;r.created=old?old.created:Date.now();
    var ok=await persist(r,!editId);
    if(ok){toast(editId?'Изменения сохранены':'Отчёт сохранён');resetForm(null)}
  };
  $('#closeM').onclick=function(){$('#modal').classList.remove('on')};
  $('#modal').onclick=function(e){if(e.target.id==='modal')$('#modal').classList.remove('on')};
  $('#copy').onclick=copyBB;
  document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){filter=b.dataset.f;document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===b)});render()}});
  $('#authBtn').onclick=function(){if(session)sb.auth.signOut();else $('#login').classList.add('on')};
  $('#loginCancel').onclick=function(){$('#login').classList.remove('on')};
  $('#loginGo').onclick=async function(){
    var q=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    if(q.error)toast('Не удалось войти: '+q.error.message);else{$('#login').classList.remove('on');$('#pw').value='';toast('Вы вошли')}
  };

  var dl=document.createElement('datalist');dl.id='types';
  dl.innerHTML=Object.keys(TYPES).map(function(k){return '<option value="'+k+'">'}).join('');
  document.body.appendChild(dl);
  resetForm(null);init();
})();
</script>
</body>
</html>
